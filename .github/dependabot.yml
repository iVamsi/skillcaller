version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze refuse to run at different versions, so they must move in one PR
      codeql-action:
        patterns:
          - "github/codeql-action*"
